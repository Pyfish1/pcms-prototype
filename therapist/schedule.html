<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Schedule — PCMS</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app" data-page="ther-schedule">
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon"><svg class="icon"><use href="../icons.svg#stethoscope"/></svg></span><span>PCMS — HoneyBee<br><small>Physiotherapy</small></span></a>
    <nav class="nav">
      <a class="active" href="schedule.html">My schedule</a>
      <a href="../receptionist/customers.html">Customers</a>
      <a href="treatment-record.html">Treatment records</a>
    </nav>
    <div class="user"><svg class="icon avatar"><use href="../icons.svg#user"/></svg> Dr. Amir Hassan · Therapist</div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>My schedule — week of 11 Aug</h1>
        <p>View assigned sessions or block a time slot as unavailable.</p>
      </div>
      <div class="spacer"></div>
      <a class="btn btn-ghost" href="#block"><svg class="icon"><use href="../icons.svg#calendar"/></svg> Block time slot</a>
    </div>

    <table class="sched">
      <thead>
        <tr><th class="corner">Time</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th></tr>
      </thead>
      <tbody id="therSchedBody"></tbody>
    </table>

    <div class="legend">
      <span><span class="dot dot-blue"></span>Booked session</span>
      <span><span class="dot dot-red"></span>Blocked / leave</span>
    </div>

    <hr class="divider">

    <h2 class="section" id="block">Block a time slot</h2>
    <div class="row" style="grid-template-columns: 1fr 1fr 1fr auto; align-items:end;">
      <div class="field"><label for="blkDate">Date</label><input class="input" id="blkDate" type="date"></div>
      <div class="field"><label for="blkFrom">From</label><input class="input" id="blkFrom" type="time"></div>
      <div class="field"><label for="blkTo">To</label><input class="input" id="blkTo" type="time"></div>
      <button class="btn" id="blkAdd" type="button">Block</button>
    </div>
  </main>
</div>
<script src="../app.js"></script>
</body>
</html>
