<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book appointment — PCMS</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app" data-page="booking">
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon"><svg class="icon"><use href="../icons.svg#stethoscope"/></svg></span><span>PCMS — HoneyBee<br><small>Physiotherapy</small></span></a>
    <nav class="nav">
      <a class="active" href="appointments.html">Appointments</a>
      <a href="therapist-schedule.html">Schedule</a>
      <a href="billing.html">Billing</a>
      <a href="#">Reports</a>
    </nav>
    <div class="user"><svg class="icon avatar"><use href="../icons.svg#user"/></svg> S. Lim · Receptionist</div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>Book new appointment</h1>
        <p>Search for a customer and select a therapy slot.</p>
      </div>
    </div>

    <div class="row row-2" style="margin-bottom:18px;">
      <div class="field">
        <label for="bkCustomer">Customer name</label>
        <input class="input" id="bkCustomer" placeholder="Search customer...">
        <div class="muted" style="font-size:12.5px;">Not registered? <a href="register.html">Register new customer</a></div>
      </div>
      <div class="field">
        <label for="bkService">Service type</label>
        <select class="input" id="bkService">
          <option>Sports massage therapy</option>
          <option>Post-surgery rehabilitation</option>
          <option>Chiropractic</option>
          <option>Scoliosis treatment</option>
        </select>
      </div>
    </div>

    <div class="row row-3" style="margin-bottom:20px;">
      <div class="field"><label for="bkDate">Date</label><input class="input" id="bkDate" type="date"></div>
      <div class="field">
        <label for="bkTime">Time slot</label>
        <select class="input" id="bkTime">
          <option>9:00 AM</option>
          <option selected>10:00 AM</option>
          <option>11:00 AM</option>
          <option>11:30 AM</option>
          <option>2:00 PM</option>
          <option>3:00 PM</option>
        </select>
      </div>
      <div class="field">
        <label for="bkTherapist">Therapist</label>
        <select class="input" id="bkTherapist">
          <option>Dr. Amir Hassan</option>
          <option>Dr. Priya Nair</option>
        </select>
      </div>
    </div>

    <div class="banner banner-green" id="bkAvail">
      <span class="ico"><svg class="icon"><use href="../icons.svg#check"/></svg></span>
      <span class="msg">Dr. Amir Hassan is available at this time.</span>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:22px;">
      <a class="btn btn-ghost" href="appointments.html">Cancel</a>
      <button class="btn" id="bkConfirm" type="button">Confirm booking</button>
    </div>
  </main>
</div>
<script src="../app.js"></script>
</body>
</html>
