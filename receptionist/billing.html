<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing - PCMS</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app" data-page="billing">
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon"><svg class="icon"><use href="../icons.svg#stethoscope"/></svg></span><span>HoneyBee<br><small>Physiotherapy</small></span></a>
    <nav class="nav">
      <a href="appointments.html">Appointments</a>
      <a href="therapist-schedule.html">Schedule</a>
      <a class="active" href="billing.html">Billing</a>
      <a href="../owner/reports.html">Reports</a>
    </nav>
    <div class="user"><svg class="icon avatar"><use href="../icons.svg#user"/></svg> S. Lim · Receptionist</div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>Generate invoice</h1>
        <p id="billHead">Customer: Rachel Tan · Session: 13 Aug 2026, 11:30 AM</p>
      </div>
    </div>

    <table class="data">
      <thead>
        <tr><th>Item</th><th class="right">Amount (RM)</th></tr>
      </thead>
      <tbody id="billRows"></tbody>
    </table>

    <div class="invoice-summary">
      <div class="line"><span>Subtotal</span><span id="billSub">RM 0.00</span></div>
      <div class="line total"><span>Total</span><span id="billTotal">RM 0.00</span></div>
    </div>

    <div id="billActions" style="display:flex; align-items:flex-end; margin-top:20px; gap:10px;">
      <div class="field" style="width:230px;">
        <label for="payMethod">Payment method</label>
        <select class="input" id="payMethod">
          <option>Credit / debit card</option>
          <option>Cash</option>
          <option>E-wallet</option>
        </select>
      </div>
      <div class="spacer" style="margin-left:auto;"></div>
      <button class="btn btn-ghost" id="btnPrint" type="button"><svg class="icon"><use href="../icons.svg#printer"/></svg> Print</button>
      <button class="btn" id="btnPay" type="button">Confirm payment</button>
    </div>
  </main>
</div>
<script src="../app.js"></script>
</body>
</html>
