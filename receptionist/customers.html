<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers - PCMS</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app" data-page="customers">
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon"><svg class="icon"><use href="../icons.svg#stethoscope"/></svg></span><span>HoneyBee<br><small>Physiotherapy</small></span></a>
    <nav class="nav">
      <a class="active" href="appointments.html">Appointments</a>
      <a href="therapist-schedule.html">Schedule</a>
      <a href="billing.html">Billing</a>
      <a href="../owner/reports.html">Reports</a>
    </nav>
    <div class="user"><svg class="icon avatar"><use href="../icons.svg#user"/></svg> S. Lim · Receptionist</div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>Search customer record</h1>
        <p>Find an existing customer by name or contact number.</p>
      </div>
      <div class="spacer"></div>
      <a class="btn btn-ghost" href="register.html"><svg class="icon"><use href="../icons.svg#plus"/></svg> Register new customer</a>
    </div>

    <div class="searchbar">
      <input class="input" id="custSearch" placeholder="Search by name or contact number...">
      <button class="icon-btn" id="custSearchBtn" type="button"><svg class="icon"><use href="../icons.svg#search"/></svg></button>
    </div>

    <table class="data">
      <thead>
        <tr><th>Name</th><th>Contact</th><th>Last visit</th><th>Total sessions</th><th class="right"></th></tr>
      </thead>
      <tbody id="custRows"></tbody>
    </table>
  </main>
</div>
<script src="../app.js"></script>
</body>
</html>
