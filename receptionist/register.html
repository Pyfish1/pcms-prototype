<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register new customer — PCMS</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app" data-page="register">
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon"><svg class="icon"><use href="../icons.svg#stethoscope"/></svg></span><span>PCMS — HoneyBee<br><small>Physiotherapy</small></span></a>
    <nav class="nav">
      <a class="active" href="appointments.html">Appointments</a>
      <a href="therapist-schedule.html">Schedule</a>
      <a href="billing.html">Billing</a>
      <a href="#">Reports</a>
    </nav>
    <div class="user"><svg class="icon avatar"><use href="../icons.svg#user"/></svg> S. Lim · Receptionist</div>
  </header>

  <main>
    <div class="page-head">
      <div>
        <h1>Register new customer</h1>
        <p>Enter the customer's details to create a new record.</p>
      </div>
      <div class="spacer"></div>
      <a class="btn btn-ghost" href="customers.html">← Back to search</a>
    </div>

    <div class="row row-3">
      <div class="field"><label for="regName">Full name</label><input class="input" id="regName" placeholder="Customer full name"></div>
      <div class="field"><label for="regContact">Contact number</label><input class="input" id="regContact" placeholder="e.g. 012-345 6789"></div>
      <div class="field"><label for="regIc">IC / Passport no.</label><input class="input" id="regIc" placeholder="Identification number"></div>
    </div>

    <div style="text-align:right; margin-top:22px;">
      <button class="btn" id="saveCustomer" type="button">Save customer</button>
    </div>
  </main>
</div>
<script src="../app.js"></script>
</body>
</html>
