<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff accounts - PCMS</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app" data-page="staff">
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-icon"><svg class="icon"><use href="../icons.svg#stethoscope"/></svg></span><span>HoneyBee<br><small>Physiotherapy</small></span></a>
    <nav class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a class="active" href="staff.html">Staff accounts</a>
      <a href="services.html">Services</a>
      <a href="reports.html">Reports</a>
    </nav>
    <div class="user"><svg class="icon avatar"><use href="../icons.svg#user"/></svg> Mr. Jared · Owner</div>
  </header>

  <main>
    <div class="page-head">
      <div><h1>Staff accounts</h1></div>
    </div>

    <div class="row" style="grid-template-columns: 1.6fr 1fr auto; align-items:end;">
      <div class="field"><label for="stName">Name</label><input class="input" id="stName" placeholder="e.g. Dr. Lim Wei Sheng"></div>
      <div class="field">
        <label for="stRole">Role</label>
        <select class="input" id="stRole"><option>Therapist</option><option>Receptionist</option></select>
      </div>
      <button class="btn" id="stAdd" type="button"><svg class="icon"><use href="../icons.svg#plus"/></svg> Add staff</button>
    </div>

    <table class="data" style="margin-top:20px;">
      <thead>
        <tr><th>Name</th><th>Role</th><th>Status</th><th class="right"></th></tr>
      </thead>
      <tbody id="staffRows">
        <tr><td class="name">Dr. Amir Hassan</td><td>Therapist</td><td><span class="pill pill-green">Active</span></td><td class="right"><a href="#" data-toggle>Edit</a></td></tr>
        <tr><td class="name">Dr. Priya Nair</td><td>Therapist</td><td><span class="pill pill-green">Active</span></td><td class="right"><a href="#" data-toggle>Edit</a></td></tr>
        <tr><td class="name">Sarah Lim</td><td>Receptionist</td><td><span class="pill pill-grey">Deactivated</span></td><td class="right"><a href="#" data-toggle>Edit</a></td></tr>
      </tbody>
    </table>

    <div class="banner banner-blue">
      <span class="ico"><svg class="icon"><use href="../icons.svg#info"/></svg></span>
      <span>Physiotherapy services are managed on the <a href="services.html">Services</a> page.</span>
    </div>
  </main>
</div>
<script src="../app.js"></script>
</body>
</html>
